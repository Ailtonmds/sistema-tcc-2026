<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Login | AgroStock</title>
    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >
    <!-- CSS -->
    <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
    <main class="login-container d-flex align-items-center justify-content-center">
        <div class="login-card">
            <!-- LOGO -->
            <div class="text-center mb-4">
                <div class="logo">
                    AG
                </div>
                <h1 class="brand">
                    AgroStock
                </h1>
                <p class="subtitle">
                    Sistema de Controle de Estoque
                </p>
            </div>
            <!-- TÍTULO -->
            <div class="mb-4">
                <h2>
                    Acesse sua conta
                </h2>
                <p class="text-secondary small mb-0">
                    Entre com seu usuário e senha.
                </p>
            </div>
            <!-- FORMULÁRIO -->
            <!-- CORRECAO: credenciais devem ser enviadas por POST, nunca pela URL. -->
            <form id="loginForm" action="backend/login.php" method="POST">
                <!-- USUÁRIO -->
                <div class="mb-3">
                    <label
                        for="usuario"
                        class="form-label"
                    >
                        Usuário
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>
                        <input
                            type="text"
                            class="form-control"
                            id="usuario"
                            name="usuario"
                            placeholder="Digite seu usuário"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>
                <!-- SENHA -->
                <div class="mb-3">
                    <label
                        for="senha"
                        class="form-label"
                    >
                        Senha
                    </label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>
                        <input
                            type="password"
                            class="form-control"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="mostrarSenha"
                            aria-label="Mostrar senha"
                        >
                            <i
                                class="bi bi-eye"
                                id="eyeIcon"
                            ></i>
                        </button>
                    </div>
                </div>
                <!-- ERRO -->
                <div
                    id="mensagemErro"
                    class="alert alert-danger d-none small"
                ></div>
                <!-- BOTÃO -->
                    <button
                        type="submit"
                        class="btn btn-login w-100 mt-2"
                        id="btnLogin"
                    >
                        <span id="textoBotao">
                            Entrar
                        </span>
                        <span
                            id="loading"
                            class="spinner-border spinner-border-sm d-none"
                        ></span>
                    </button>
            </form>
            <!-- RODAPÉ -->
            <div class="text-center mt-4">
                <small class="text-secondary">
                    Sistema interno • AgroStock
                </small>
            </div>
        </div>
    </main>
    <!-- Bootstrap JS -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
    <!-- CORRECAO: restaura o comportamento do botao de visualizar senha. -->
    <script src="frontend/login.js"></script>
</body>
</html>
