<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | AgroStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark agro-navbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../dashboard/">
                <span class="navbar-logo">AG</span>
                <span>AgroStock</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../dashboard/"><i class="bi bi-grid me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link active" href="../produtos/"><i class="bi bi-box-seam me-1"></i>Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="../categorias/"><i class="bi bi-tags me-1"></i>Categorias</a></li>
                    <li class="nav-item"><a class="nav-link" href="../lotes/"><i class="bi bi-upc-scan me-1"></i>Lotes</a></li>
                    <li class="nav-item"><a class="nav-link" href="../estoque/"><i class="bi bi-arrow-left-right me-1"></i>Estoque</a></li>
                    <li class="nav-item"><a class="nav-link" href="../alertas/"><i class="bi bi-bell me-1"></i>Alertas</a></li>
                    <li class="nav-item"><a class="nav-link" href="../relatorios/"><i class="bi bi-file-earmark-bar-graph me-1"></i>Relatórios</a></li>
                    <li class="nav-item"><a class="nav-link" href="../usuarios/"><i class="bi bi-people me-1"></i>Usuários</a></li>
                    <li class="nav-item"><button class="nav-link btn btn-link text-white p-0" id="btnLogout"><i class="bi bi-box-arrow-right me-1"></i>Sair</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <span class="text-uppercase small fw-bold text-success">Estoque</span>
                <h1 class="h3 fw-bold mb-1">Produtos</h1>
                <p class="text-secondary mb-0">Gerencie os produtos do almoxarifado</p>
            </div>
            <button class="btn btn-success px-4" data-bs-toggle="modal" data-bs-target="#modalProduto" onclick="abrirModalNovo()">
                <i class="bi bi-plus-lg me-1"></i>Novo produto
            </button>
        </div>

        <!-- Busca e filtros -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input type="text" class="form-control" id="buscaProduto" placeholder="Buscar por nome..." onkeyup="debounceBusca()">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="filtroCategoria" onchange="carregarProdutos()">
                            <option value="">Todas as categorias</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <select class="form-select" id="filtroStatus" onchange="carregarProdutos()">
                            <option value="">Todos</option>
                            <option value="1">Ativos</option>
                            <option value="0">Inativos</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tabela de produtos -->
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="tabelaProdutos">
                        <thead class="table-light">
                            <tr>
                                <th>Nome</th>
                                <th>Categoria</th>
                                <th>Unidade</th>
                                <th>Estoque Mín.</th>
                                <th>Qtd. Total</th>
                                <th>Localização</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="8" class="text-center text-secondary py-4">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Produto -->
    <div class="modal fade" id="modalProduto" tabindex="-1" aria-labelledby="modalProdutoLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalProdutoLabel">Novo Produto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <form id="formProduto">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="produtoId">
                        
                        <div class="mb-3">
                            <label for="nome" class="form-label fw-semibold">Nome do produto <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nome" name="nome" required>
                        </div>
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="categoria_id" class="form-label fw-semibold">Categoria <span class="text-danger">*</span></label>
                                <select class="form-select" id="categoria_id" name="categoria_id" required>
                                    <option value="">Selecione</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="unidade_medida" class="form-label fw-semibold">Unidade de medida <span class="text-danger">*</span></label>
                                <select class="form-select" id="unidade_medida" name="unidade_medida" required>
                                    <option value="">Selecione</option>
                                    <option value="Unidade">Unidade</option>
                                    <option value="Caixa">Caixa</option>
                                    <option value="Pacote">Pacote</option>
                                    <option value="Saco">Saco</option>
                                    <option value="Par">Par</option>
                                    <option value="Frasco">Frasco</option>
                                    <option value="Metro">Metro</option>
                                    <option value="Litro">Litro</option>
                                    <option value="Quilograma">Quilograma</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="descricao" class="form-label fw-semibold">Descrição</label>
                            <textarea class="form-control" id="descricao" name="descricao" rows="2"></textarea>
                        </div>
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="estoque_minimo" class="form-label fw-semibold">Estoque mínimo</label>
                                <input type="number" class="form-control" id="estoque_minimo" name="estoque_minimo" value="0" min="0">
                            </div>
                            <div class="col-md-6">
                                <label for="localizacao" class="form-label fw-semibold">Localização</label>
                                <input type="text" class="form-control" id="localizacao" name="localizacao" placeholder="Ex: Prateleira A1, Refrigerador 1">
                            </div>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="ativo" name="ativo" checked>
                            <label class="form-check-label" for="ativo">Ativo</label>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success" id="btnSalvarProduto">
                            <i class="bi bi-check-lg me-1"></i>Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/produtos.js"></script>
</body>
</html>
