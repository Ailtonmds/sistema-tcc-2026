<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotes | AgroStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark agro-navbar">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="../dashboard/">
                <span class="navbar-logo">AG</span>
                <span>AgroStock</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../dashboard/"><i class="bi bi-grid me-1"></i>Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="../produtos/"><i class="bi bi-box-seam me-1"></i>Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="../categorias/"><i class="bi bi-tags me-1"></i>Categorias</a></li>
                    <li class="nav-item"><a class="nav-link active" href="../lotes/"><i class="bi bi-upc-scan me-1"></i>Lotes</a></li>
                    <li class="nav-item"><a class="nav-link" href="../estoque/"><i class="bi bi-arrow-left-right me-1"></i>Estoque</a></li>
                    <li class="nav-item"><a class="nav-link" href="../alertas/"><i class="bi bi-bell me-1"></i>Alertas</a></li>
                    <li class="nav-item"><a class="nav-link" href="../relatorios/"><i class="bi bi-file-earmark-bar-graph me-1"></i>Relatórios</a></li>
                    <li class="nav-item"><a class="nav-link" href="../usuarios/"><i class="bi bi-people me-1"></i>Usuários</a></li>
                    <li class="nav-item"><button class="nav-link btn btn-link text-white p-0" id="btnLogout"><i class="bi bi-box-arrow-right me-1"></i>Sair</button></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <span class="text-uppercase small fw-bold text-success">Estoque</span>
                <h1 class="h3 fw-bold mb-1">Lotes</h1>
                <p class="text-secondary mb-0">Gerencie os lotes dos produtos</p>
            </div>
            <button class="btn btn-success px-4" data-bs-toggle="modal" data-bs-target="#modalLote" onclick="abrirModalNovo()">
                <i class="bi bi-plus-lg me-1"></i>Novo lote
            </button>
        </div>

        <!-- Filtro por produto -->
        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Filtrar por produto</label>
                        <select class="form-select" id="filtroProduto" onchange="carregarLotes()">
                            <option value="">Todos os produtos</option>
                        </select>
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <select class="form-select" id="filtroStatusValidade" onchange="carregarLotes()">
                            <option value="">Todos</option>
                            <option value="vencidos">Vencidos</option>
                            <option value="proximos">Próximos do vencimento</option>
                            <option value="ok">Válidos</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0" id="tabelaLotes">
                        <thead class="table-light">
                            <tr>
                                <th>Produto</th>
                                <th>Número do Lote</th>
                                <th>Fabricação</th>
                                <th>Validade</th>
                                <th>Qtd. Disponível</th>
                                <th>Status</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td colspan="7" class="text-center text-secondary py-4">Carregando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Lote -->
    <div class="modal fade" id="modalLote" tabindex="-1" aria-labelledby="modalLoteLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalLoteLabel">Novo Lote</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <form id="formLote">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="loteId">
                        
                        <div class="mb-3">
                            <label for="produto_id" class="form-label fw-semibold">Produto <span class="text-danger">*</span></label>
                            <select class="form-select" id="produto_id" name="produto_id" required>
                                <option value="">Selecione um produto</option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="numero_lote" class="form-label fw-semibold">Número do Lote <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="numero_lote" name="numero_lote" required maxlength="100">
                        </div>
                        
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="data_fabricacao" class="form-label fw-semibold">Data de Fabricação</label>
                                <input type="date" class="form-control" id="data_fabricacao" name="data_fabricacao">
                            </div>
                            <div class="col-md-6">
                                <label for="data_validade" class="form-label fw-semibold">Data de Validade <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="data_validade" name="data_validade" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="quantidade" class="form-label fw-semibold">Quantidade Inicial <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="quantidade" name="quantidade" required min="1" value="1">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success" id="btnSalvarLote">
                            <i class="bi bi-check-lg me-1"></i>Salvar
                        </button>
                    </div>
                </form>
            </div>
        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/lotes.js"></script>
</body>
</html>
